<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PANINI console</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    #out { background:#000; color:#cde; font:14px/1.35 ui-monospace,monospace; padding:.7rem;
           min-height:18rem; max-height:70vh; overflow:auto; border:1px solid #c9a227; white-space:pre-wrap; margin:0; }
    #row { display:flex; background:#000; border:1px solid #c9a227; border-top:0; padding:.35rem .5rem; font:14px ui-monospace,monospace; color:#cde; }
    #row input { flex:1; background:#000; color:#cde; border:0; font:inherit; outline:none; }
  </style>
</head>
<body class="site">
<header class="site-head">
  <strong>CONSOLE</strong>
  <nav>
    <a href="index.html">Home</a>
    <a href="nb.html">Notebook</a>
    <a href="ontology.html">Ontology</a>
    <a href="workbench.html">Workbench</a>
  </nav>
</header>
<main class="site-main">
  <h1>Online console</h1>
  <p>VT100-class text. bash and COMMAND.COM on an in-memory VFS. This page is self-contained (does not depend on a cached <code>console.js</code>).</p>
  <p>
    Shell:
    <select id="shsel">
      <option value="bash">bash</option>
      <option value="sh">sh</option>
      <option value="dash">dash</option>
      <option value="zsh">zsh</option>
      <option value="ksh">ksh</option>
      <option value="csh">csh</option>
      <option value="command.com">COMMAND.COM</option>
      <option value="cmd">cmd</option>
      <option value="4dos">4DOS</option>
      <option value="panini">panini</option>
    </select>
    <label><input type="checkbox" id="vt" checked /> VT100 80×24</label>
  </p>
  <canvas id="vtcan" width="640" height="384" style="display:block;background:#001400;border:1px solid #0a4;margin:.4rem 0;image-rendering:pixelated"></canvas>
  <pre id="out"></pre>
  <div id="row"><span id="ps1">panini$ </span><input id="cmd" autocomplete="off" autofocus /></div>
</main>
<script>
(function () {
  function dir() { return { type: "dir", children: Object.create(null) }; }
  function file(x) { return { type: "file", content: String(x || "") }; }
  var root = dir();
  root.children.home = dir();
  root.children.home.children.panini = dir();
  root.children.home.children.panini.children["readme.txt"] = file("PANINI VFS\nCopyright (C) 1993-2026 Abhishek Choudhary\nType help.\n");
  root.children.tmp = dir();
  root.children.bin = dir();
  var state = { cwd: "/home/panini", root: root };
  function split(p) { return String(p).split("/").filter(Boolean); }
  function abs(path) {
    if (!path || path === ".") return state.cwd;
    if (path === "..") { var a = split(state.cwd); a.pop(); return "/" + a.join("/"); }
    if (path.charAt(0) === "/" || /^[A-Za-z]:/.test(path)) return "/" + split(path.replace(/^[A-Za-z]:/, "")).join("/");
    return (state.cwd.replace(/\/$/, "") + "/" + path).replace(/\/+/g, "/");
  }
  function walk(parts, create) {
    var cur = root;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!cur.children[p]) { if (!create) return null; cur.children[p] = dir(); }
      cur = cur.children[p];
      if (cur.type !== "dir") return null;
    }
    return cur;
  }
  function resolve(path) {
    var full = abs(path);
    if (full === "/" || full === "") return { path: "/", node: root };
    var parts = split(full);
    var name = parts.pop();
    var d = walk(parts, false);
    if (!d || !d.children[name]) return null;
    return { path: "/" + parts.concat([name]).join("/"), node: d.children[name] };
  }
  var fs = {
    pwd: function () { return state.cwd; },
    cd: function (path) {
      var n = resolve(path || "/home/panini");
      if (!n || n.node.type !== "dir") return { ok: false };
      state.cwd = n.path; return { ok: true };
    },
    ls: function (path) {
      var n = resolve(path || ".");
      if (!n || n.node.type !== "dir") return { ok: false, names: [] };
      return { ok: true, names: Object.keys(n.node.children).sort() };
    },
    read: function (path) {
      var n = resolve(path);
      if (!n || n.node.type !== "file") return { ok: false, content: "" };
      return { ok: true, content: n.node.content };
    },
    write: function (path, content) {
      var parts = split(abs(path)); var name = parts.pop();
      var d = walk(parts, true); if (!d) return { ok: false };
      d.children[name] = file(content); return { ok: true };
    },
    mkdir: function (path) { walk(split(abs(path)), true); return { ok: true }; },
    rm: function (path) {
      var parts = split(abs(path)); var name = parts.pop();
      var d = walk(parts, false);
      if (!d || !d.children[name]) return { ok: false };
      delete d.children[name]; return { ok: true };
    }
  };
  function tokenize(line) {
    var out = [], cur = "", q = null, i, ch;
    var s = String(line);
    for (i = 0; i < s.length; i++) {
      ch = s.charAt(i);
      if (q) { if (ch === q) q = null; else cur += ch; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ""; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  var histSh = [];
  function bash(line) {
    var raw = String(line || "").trim();
    if (!raw) return "";
    histSh.push(raw);
    var toks = tokenize(raw), mode = null, target = null, cut = toks.length, i;
    for (i = 0; i < toks.length; i++) {
      if (toks[i] === ">" || toks[i] === ">>") { mode = toks[i]; target = toks[i + 1]; cut = i; break; }
    }
    var args = toks.slice(0, cut);
    var c = String(args[0] || "").toLowerCase();
    var a = args.slice(1);
    var out = "";
    if (c === "pwd") out = fs.pwd();
    else if (c === "ls") {
      var r = fs.ls(a.filter(function (x) { return x.charAt(0) !== "-"; })[0] || ".");
      out = r.ok ? r.names.join("\n") : "ls: cannot access: No such file or directory";
    } else if (c === "cd") {
      r = fs.cd(a[0] || "/home/panini");
      out = r.ok ? "" : "bash: cd: " + a[0] + ": No such file or directory";
    } else if (c === "cat") {
      out = a.map(function (p) { var rr = fs.read(p); return rr.ok ? rr.content : "cat: " + p + ": No such file"; }).join("");
    } else if (c === "echo") out = a.join(" ");
    else if (c === "mkdir") fs.mkdir(a[0] || "");
    else if (c === "touch") { var prev = fs.read(a[0] || "a"); fs.write(a[0] || "a", prev.content || ""); }
    else if (c === "rm") { r = fs.rm(a[0]); out = r.ok ? "" : "rm: cannot remove"; }
    else if (c === "cp") { var s = fs.read(a[0]); if (s.ok) fs.write(a[1], s.content); else out = "cp: No such file"; }
    else if (c === "mv") { s = fs.read(a[0]); if (s.ok) { fs.write(a[1], s.content); fs.rm(a[0]); } else out = "mv: No such file"; }
    else if (c === "whoami") out = "panini";
    else if (c === "uname") out = "PANINI-486";
    else if (c === "help") out = "pwd ls cd cat echo mkdir touch rm cp mv whoami uname help";
    else out = c + ": command not found";
    if (target) {
      var old = mode === ">>" ? (fs.read(target).content || "") : "";
      fs.write(target, old + out + (out.slice(-1) === "\n" ? "" : "\n"));
      return "";
    }
    return out;
  }
  function commandCom(line) {
    var t = tokenize(line);
    var c = String(t[0] || "").toUpperCase();
    if (!c) return "";
    if (c === "DIR") return bash("ls " + (t[1] || ""));
    if (c === "CD") return bash("cd " + (t[1] || ""));
    if (c === "TYPE") return bash("cat " + (t[1] || ""));
    if (c === "ECHO") return bash("echo " + t.slice(1).join(" "));
    if (c === "CLS") return "\x1b[2J";
    if (c === "MD") return bash("mkdir " + t[1]);
    if (c === "DEL") return bash("rm " + t[1]);
    if (c === "COPY") return bash("cp " + t[1] + " " + t[2]);
    if (c === "VER") return "PANINI COMMAND.COM";
    if (c === "HELP") return "DIR CD TYPE ECHO CLS MD DEL COPY VER HELP";
    return "Bad command or file name";
  }
  function family(sh) {
    sh = String(sh || "bash").toLowerCase();
    if (sh === "command.com" || sh === "cmd" || sh === "4dos" || sh === "command") return "command.com";
    if (sh === "panini") return "panini";
    return "bash";
  }
  function paniniLine(line) {
    var s = String(line || "").trim();
    if (!s) return "";
    if (/^PRINT\s+/i.test(s)) return s.replace(/^PRINT\s+/i, "");
    if (/^help$/i.test(s)) return "PANINI shell subset: PRINT …";
    return s;
  }
  function exec(sh, line) {
    var f = family(sh);
    if (f === "command.com") return commandCom(line);
    if (f === "panini") return paniniLine(line);
    return bash(line);
  }
  window.PANINI_CONSOLE = { bash: bash, commandCom: commandCom, exec: exec };

  var outEl = document.getElementById("out");
  var cmd = document.getElementById("cmd");
  var ps1 = document.getElementById("ps1");
  var shsel = document.getElementById("shsel");
  var vtcan = document.getElementById("vtcan");
  var vtchk = document.getElementById("vt");
  var sh = "bash";
  var hist = [], hi = 0;
  function initVt() {
    vt.grid = [];
    for (var y = 0; y < vt.rows; y++) {
      var row = [];
      for (var x = 0; x < vt.cols; x++) row.push(" ");
      vt.grid.push(row);
    }
    vt.r = 0; vt.c = 0;
  }
  initVt();
  function vtPut(ch) {
    if (ch === "\n") { vt.r = Math.min(vt.rows - 1, vt.r + 1); vt.c = 0; return; }
    if (ch === "\r") { vt.c = 0; return; }
    if (ch === "\b") { vt.c = Math.max(0, vt.c - 1); return; }
    vt.grid[vt.r][vt.c] = ch;
    vt.c++;
    if (vt.c >= vt.cols) { vt.c = 0; vt.r = Math.min(vt.rows - 1, vt.r + 1); }
  }
  function vtWrite(s) {
    s = String(s);
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === "\x1b" && s.charAt(i + 1) === "[" && s.charAt(i + 2) === "2" && s.charAt(i + 3) === "J") {
        initVt(); vt.r = 0; vt.c = 0; i += 3; continue;
      }
      vtPut(s.charAt(i));
    }
    if (vtcan && vtcan.getContext) {
      var ctx = vtcan.getContext("2d");
      var cw = 8, ch = 16;
      vtcan.width = vt.cols * cw;
      vtcan.height = vt.rows * ch;
      ctx.fillStyle = "#001400";
      ctx.fillRect(0, 0, vtcan.width, vtcan.height);
      ctx.fillStyle = "#33ff66";
      ctx.font = "14px ui-monospace, monospace";
      for (var y = 0; y < vt.rows; y++) ctx.fillText(vt.grid[y].join(""), 1, 13 + y * ch);
      ctx.fillRect(vt.c * cw, vt.r * ch, 7, 14);
    }
  }
  function prompt() {
    var f = family(sh);
    if (f === "command.com") return "C:\\> ";
    if (f === "panini") return "pni> ";
    if (sh === "csh") return "% ";
    return "panini$ ";
  }
  function append(t) {
    outEl.textContent += t;
    outEl.scrollTop = outEl.scrollHeight;
    if (!vtchk || vtchk.checked) vtWrite(t);
  }
  append("PANINI console · VT100 80×24 · shells: bash sh dash zsh ksh csh COMMAND.COM cmd 4DOS panini\nType help. Try: ls · cat readme.txt\n");
  if (shsel) shsel.onchange = function () { sh = shsel.value; ps1.textContent = prompt(); append("[shell " + sh + "]\n"); };
  if (vtchk) vtchk.onchange = function () { if (vtcan) vtcan.style.display = vtchk.checked ? "block" : "none"; };
  cmd.onkeydown = function (e) {
    if (e.key === "ArrowUp") {
      if (hist.length) { hi = Math.max(0, hi - 1); cmd.value = hist[hi] || ""; }
      e.preventDefault(); return;
    }
    if (e.key === "ArrowDown") {
      hi = Math.min(hist.length, hi + 1); cmd.value = hist[hi] || "";
      e.preventDefault(); return;
    }
    if (e.key !== "Enter") return;
    var line = cmd.value;
    hist.push(line); hi = hist.length;
    append(prompt() + line + "\n");
    cmd.value = "";
    var res = "";
    try { res = exec(sh, line); }
    catch (err) { res = String(err); }
    if (res === "\x1b[2J") outEl.textContent = "";
    else if (res) append(res.charAt(res.length - 1) === "\n" ? res : res + "\n");
  };
})();
</script>
</body>
</html>
