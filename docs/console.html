<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PANINI console</title>
  <link rel="stylesheet" href="site.css" />
  <style>
    .crt { max-width: 52rem; margin: 1rem auto 3rem; }
    .bezel {
      background: linear-gradient(180deg, #2a2a2a, #111);
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: 0 18px 40px #000, inset 0 1px 0 #555;
    }
    .led { width: 8px; height: 8px; border-radius: 50%; background: #3f3; box-shadow: 0 0 8px #3f3; margin: 0 0 8px auto; }
    #glass { display: block; width: 100%; height: auto; background: #001400; border-radius: 4px; image-rendering: pixelated; }
    .kbd {
      display: flex; align-items: center; gap: .4rem;
      margin-top: 10px; background: #1a1a1a; border-radius: 6px;
      padding: .35rem .55rem; font: 14px ui-monospace, monospace; color: #8f8;
    }
    .kbd input { flex: 1; background: transparent; border: 0; color: #cfc; font: inherit; outline: none; }
    .deck { margin: .6rem 0; font-size: .9rem; }
  </style>
</head>
<body class="site">
<header class="site-head">
  <a href="index.html"><strong>PANINI</strong></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="sims/">Sims</a>
    <a href="nb.html">Notebook</a>
    <a href="workbench.html">Workbench</a>
  </nav>
</header>
<main class="site-main">
  <h1>Console</h1>
  <p>One monitor. The glass is the VT100. The strip under it is the keyboard. Not two screens.</p>
  <p class="deck">
    Shell
    <select id="shsel">
      <option value="bash">bash</option>
      <option value="sh">sh</option>
      <option value="dash">dash</option>
      <option value="zsh">zsh</option>
      <option value="ksh">ksh</option>
      <option value="csh">csh</option>
      <option value="command.com">COMMAND.COM</option>
      <option value="cmd">cmd</option>
      <option value="4dos">4DOS</option>
      <option value="panini">panini</option>
    </select>
  </p>
  <section class="crt" aria-label="VT100 monitor">
    <div class="bezel">
      <div class="led" title="power"></div>
      <canvas id="glass" width="640" height="384"></canvas>
      <div class="kbd"><span id="ps1">panini$ </span><input id="cmd" autocomplete="off" autofocus /></div>
    </div>
  </section>
</main>
<script>
(function () {
  function dir() { return { type: "dir", children: Object.create(null) }; }
  function file(x) { return { type: "file", content: String(x || "") }; }
  var root = dir();
  root.children.home = dir();
  root.children.home.children.panini = dir();
  root.children.home.children.panini.children["readme.txt"] = file("PANINI VFS\nType help.\n");
  root.children.tmp = dir();
  var state = { cwd: "/home/panini", root: root };
  function split(p) { return String(p).split("/").filter(Boolean); }
  function abs(path) {
    if (!path || path === ".") return state.cwd;
    if (path === "..") { var a = split(state.cwd); a.pop(); return "/" + a.join("/"); }
    if (path.charAt(0) === "/" || /^[A-Za-z]:/.test(path)) return "/" + split(path.replace(/^[A-Za-z]:/, "")).join("/");
    return (state.cwd.replace(/\/$/, "") + "/" + path).replace(/\/+/g, "/");
  }
  function walk(parts, create) {
    var cur = root;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!cur.children[p]) { if (!create) return null; cur.children[p] = dir(); }
      cur = cur.children[p];
      if (cur.type !== "dir") return null;
    }
    return cur;
  }
  function resolve(path) {
    var full = abs(path);
    if (full === "/" || full === "") return { path: "/", node: root };
    var parts = split(full);
    var name = parts.pop();
    var d = walk(parts, false);
    if (!d || !d.children[name]) return null;
    return { path: "/" + parts.concat([name]).join("/"), node: d.children[name] };
  }
  var fs = {
    pwd: function () { return state.cwd; },
    cd: function (path) {
      var n = resolve(path || "/home/panini");
      if (!n || n.node.type !== "dir") return { ok: false };
      state.cwd = n.path; return { ok: true };
    },
    ls: function (path) {
      var n = resolve(path || ".");
      if (!n || n.node.type !== "dir") return { ok: false, names: [] };
      return { ok: true, names: Object.keys(n.node.children).sort() };
    },
    read: function (path) {
      var n = resolve(path);
      if (!n || n.node.type !== "file") return { ok: false, content: "" };
      return { ok: true, content: n.node.content };
    },
    write: function (path, content) {
      var parts = split(abs(path)); var name = parts.pop();
      var d = walk(parts, true); if (!d) return { ok: false };
      d.children[name] = file(content); return { ok: true };
    },
    mkdir: function (path) { walk(split(abs(path)), true); return { ok: true }; },
    rm: function (path) {
      var parts = split(abs(path)); var name = parts.pop();
      var d = walk(parts, false);
      if (!d || !d.children[name]) return { ok: false };
      delete d.children[name]; return { ok: true };
    }
  };
  function tokenize(line) {
    var out = [], cur = "", q = null, i, ch, s = String(line);
    for (i = 0; i < s.length; i++) {
      ch = s.charAt(i);
      if (q) { if (ch === q) q = null; else cur += ch; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ""; } }
      else cur += ch;
    }
    if (cur) out.push(cur);
    return out;
  }
  function bash(line) {
    var raw = String(line || "").trim();
    if (!raw) return "";
    var toks = tokenize(raw), mode = null, target = null, cut = toks.length, i;
    for (i = 0; i < toks.length; i++) {
      if (toks[i] === ">" || toks[i] === ">>") { mode = toks[i]; target = toks[i + 1]; cut = i; break; }
    }
    var args = toks.slice(0, cut);
    var c = String(args[0] || "").toLowerCase();
    var a = args.slice(1), out = "", r, s;
    if (c === "pwd") out = fs.pwd();
    else if (c === "ls") { r = fs.ls(a.filter(function (x) { return x.charAt(0) !== "-"; })[0] || "."); out = r.ok ? r.names.join("\n") : "ls: No such file"; }
    else if (c === "cd") { r = fs.cd(a[0] || "/home/panini"); out = r.ok ? "" : "bash: cd: No such file"; }
    else if (c === "cat") { out = a.map(function (p) { var rr = fs.read(p); return rr.ok ? rr.content : "cat: " + p; }).join(""); }
    else if (c === "echo") out = a.join(" ");
    else if (c === "mkdir") fs.mkdir(a[0] || "");
    else if (c === "help") out = "pwd ls cd cat echo mkdir help";
    else if (c === "clear" || c === "cls") out = "\x1b[2J";
    else out = c + ": command not found";
    if (target) { fs.write(target, out + "\n"); return ""; }
    return out;
  }
  function commandCom(line) {
    var t = tokenize(line);
    var c = String(t[0] || "").toUpperCase();
    if (!c) return "";
    if (c === "DIR") return bash("ls " + (t[1] || ""));
    if (c === "CD") return bash("cd " + (t[1] || ""));
    if (c === "TYPE") return bash("cat " + (t[1] || ""));
    if (c === "ECHO") return bash("echo " + t.slice(1).join(" "));
    if (c === "CLS") return "\x1b[2J";
    if (c === "HELP") return "DIR CD TYPE ECHO CLS HELP";
    return "Bad command or file name";
  }
  function family(sh) {
    sh = String(sh || "bash").toLowerCase();
    if (sh === "command.com" || sh === "cmd" || sh === "4dos") return "command.com";
    if (sh === "panini") return "panini";
    return "bash";
  }
  function exec(sh, line) {
    var f = family(sh);
    if (f === "command.com") return commandCom(line);
    if (f === "panini") {
      if (/^PRINT\s+/i.test(line)) return String(line).replace(/^PRINT\s+/i, "");
      return "pni: PRINT …";
    }
    return bash(line);
  }
  window.PANINI_CONSOLE = { bash: bash, commandCom: commandCom, exec: exec };

  var glass = document.getElementById("glass");
  var cmd = document.getElementById("cmd");
  var ps1 = document.getElementById("ps1");
  var shsel = document.getElementById("shsel");
  var sh = "bash";
  var hist = [], hi = 0;
  var vt = { cols: 80, rows: 24, r: 0, c: 0, grid: [] };
  function blankRow() { var r = []; for (var x = 0; x < vt.cols; x++) r.push(" "); return r; }
  function initVt() {
    vt.grid = [];
    for (var y = 0; y < vt.rows; y++) vt.grid.push(blankRow());
    vt.r = 0; vt.c = 0;
  }
  function scroll() {
    vt.grid.shift();
    vt.grid.push(blankRow());
    vt.r = vt.rows - 1;
    vt.c = 0;
  }
  function paint() {
    var ctx = glass.getContext("2d");
    var cw = 8, ch = 16;
    glass.width = vt.cols * cw;
    glass.height = vt.rows * ch;
    ctx.fillStyle = "#001400";
    ctx.fillRect(0, 0, glass.width, glass.height);
    ctx.fillStyle = "#33ff66";
    ctx.font = "14px ui-monospace,monospace";
    for (var y = 0; y < vt.rows; y++) ctx.fillText(vt.grid[y].join(""), 1, 13 + y * ch);
    ctx.fillRect(vt.c * cw, vt.r * ch, 7, 14);
  }
  function vtPut(ch) {
    if (ch === "\n") {
      if (vt.r >= vt.rows - 1) scroll();
      else { vt.r++; vt.c = 0; }
      return;
    }
    if (ch === "\r") { vt.c = 0; return; }
    vt.grid[vt.r][vt.c] = ch;
    vt.c++;
    if (vt.c >= vt.cols) {
      vt.c = 0;
      if (vt.r >= vt.rows - 1) scroll();
      else vt.r++;
    }
  }
  function vtWrite(s) {
    s = String(s);
    for (var i = 0; i < s.length; i++) {
      if (s.charAt(i) === "\x1b" && s.substr(i, 4) === "\x1b[2J") { initVt(); i += 3; continue; }
      vtPut(s.charAt(i));
    }
    paint();
  }
  function prompt() {
    var f = family(sh);
    if (f === "command.com") return "C:\\> ";
    if (f === "panini") return "pni> ";
    if (sh === "csh") return "% ";
    return "panini$ ";
  }
  initVt();
  vtWrite("VT100 80x24  one glass\nType help. ls  cat readme.txt\n");
  if (shsel) shsel.onchange = function () { sh = shsel.value; ps1.textContent = prompt(); vtWrite("[shell " + sh + "]\n"); };
  cmd.onkeydown = function (e) {
    if (e.key === "ArrowUp") {
      if (hist.length) { hi = Math.max(0, hi - 1); cmd.value = hist[hi] || ""; }
      e.preventDefault(); return;
    }
    if (e.key === "ArrowDown") {
      hi = Math.min(hist.length, hi + 1); cmd.value = hist[hi] || "";
      e.preventDefault(); return;
    }
    if (e.key !== "Enter") return;
    var line = cmd.value;
    hist.push(line); hi = hist.length;
    vtWrite(prompt() + line + "\n");
    cmd.value = "";
    var res = "";
    try { res = exec(sh, line); } catch (err) { res = String(err); }
    if (res === "\x1b[2J") { initVt(); paint(); }
    else if (res) vtWrite(res.charAt(res.length - 1) === "\n" ? res : res + "\n");
  };
})();
</script>
</body>
</html>
