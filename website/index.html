<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PANINI Workbench</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <strong>PANINI Workbench</strong>
    <span class="muted">L15 · GitHub Pages · no backend</span>
    <nav>
      <button data-view="beginner">Beginner</button>
      <button data-view="engineer">Engineer</button>
      <button data-view="linguist">Linguist</button>
      <button data-view="math">Mathematics</button>
      <button data-view="agi">AGI L0–L26</button>
      <button data-view="museum">Languages</button>
      <button data-view="ci">CI / Project</button>
      <button data-view="blocks">Blocks</button>
      <button data-view="gfx">Graphics / WebGPU</button>
      <button data-view="status">Status</button>
      <button data-view="vscode">VS Code / Debug</button>
    </nav>
  </header>
  <main>
    <section id="editor-pane">
      <textarea id="src">PRINT "HELLO"

FUNCTION double(x)
    RETURN x * 2
END

PRINT double(21)</textarea>
      <div class="row">
        <label>Lang
          <select id="lang">
            <option value="panini">PANINI</option>
            <option value="python">Python</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="fortran">Fortran</option>
            <option value="rust">Rust</option>
            <option value="typescript">TypeScript</option>
            <option value="go">Go</option>
            <option value="zig">Zig</option>
          </select>
        </label>
        <button id="run">Run</button>
        <button id="prove">Hash / Provenance</button>
        <button id="download">Download .pni</button>
        <label>View
          <select id="proj">
            <option value="latin_en">English</option>
            <option value="devanagari_hi">हिन्दी</option>
            <option value="arabic_ar">العربية</option>
          </select>
        </label>
      </div>
      <pre id="out"></pre>
    </section>
    <aside>
      <h2 id="aside-title">Inspector</h2>
      <canvas id="turtle" width="280" height="220"></canvas>
      <pre id="inspect"></pre>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
